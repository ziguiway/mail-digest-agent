name: mail-digest-agent

x-application: &application
  image: ${MAIL_ASSISTANT_IMAGE:-mail-digest-agent:local}
  build: .
  restart: unless-stopped
  volumes:
    - workspace:/var/lib/mail-assistant
  stop_grace_period: 45s
  environment:
    MAIL_ASSISTANT_MODE: ${MAIL_ASSISTANT_MODE:-live}
  healthcheck:
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 20s

services:
  api:
    <<: *application
    command: ["--host", "0.0.0.0", "api"]
    ports:
      - "127.0.0.1:${MAIL_ASSISTANT_HTTP_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "/app/deploy/health.py", "api"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
  worker:
    <<: *application
    command: ["worker"]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/health.py", "worker"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  workspace:
