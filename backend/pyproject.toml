[project]
name = "mail-assistant"
version = "0.2.0"
description = "Self-hosted multi-mailbox workspace with Agently and MCP"
requires-python = ">=3.11"
dependencies = [
  "agently==4.1.4.10", "mcp-email-server==1.14.0", "fastmcp==3.4.11", "mcp==1.30.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "apscheduler==3.11.3",
  "cryptography>=46", "httpx>=0.28.1,<0.29", "tzdata>=2025.2",
]

[project.scripts]
mail-assistant = "mail_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
